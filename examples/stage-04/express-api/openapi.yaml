                    "meta": {
                      "$ref": "#/components/schemas/Meta"
                    }
                  }
                }
              }
            }
          },
          "422": {
            "description": "Entrada inválida. A mídia/formato depende da stack e camada: domínio pode usar Problem Details; validação/parser usam formato nativo. Confira Content-Type.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              },
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NativeError"
                }
              }
            }
          }
        }
      },
