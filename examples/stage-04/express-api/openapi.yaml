  "components": {
    "schemas": {
      "BookInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "category"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "category": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "note": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          }
        }
      },
      "BookingInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "slot"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "slot": {
            "type": "string",
            "format": "date-time",
            "description": "Horário UTC exato da agenda publicada, futuro relativamente ao relógio do servidor."
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string",
            "format": "uri-reference"
          }
        }
      },
      "Book": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "title",
          "category",
          "note"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "category": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "note": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          }
        }
      },
      "Booking": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "slot",
          "status"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "slot": {
            "type": "string",
            "format": "date-time",
            "description": "Horário UTC exato da agenda publicada, futuro relativamente ao relógio do servidor."
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "cancelled"
            ]
          }
        }
      },
      "Meta": {
        "type": "object",
        "required": [
          "page",
          "per_page",
          "total"
        ],
        "properties": {
          "page": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10000
          },
          "per_page": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "total": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "NativeError": {
        "type": "object",
        "required": [
          "message"
