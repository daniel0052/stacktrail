    "title": "StackTrail — catálogo e agendamentos",
    "version": "1.0.0",
    "description": "Contrato didático. Uma stack escolhida; dados temporários. Modelo browser usa relógio fixo2030-06-01; projetos usam relógio injetável. Não garante consistência multiprocesso."
